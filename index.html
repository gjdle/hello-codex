<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>Hello, Codex</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f8f7f2;
      background: #171916;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      position: relative;
      width: min(100% - 40px, 920px);
      min-height: min(68vh, 540px);
      display: grid;
      place-items: center;
      isolation: isolate;
      border: 1px solid #42483e;
      border-radius: 28px;
      background: radial-gradient(ellipse at 50% 45%, #28352b 0%, #1d241e 43%, #191c19 78%);
      box-shadow: 0 30px 100px #0007, inset 0 1px #ffffff0b;
    }
    main::before, main::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 250px;
      height: 250px;
      border: 1px solid #b9d39c24;
      border-radius: 50%;
    }
    main::after { width: 360px; height: 360px; border-color: #b9d39c12; }
    .content { text-align: center; padding: 32px; }
    .eyebrow {
      margin: 0 0 22px;
      color: #b9d39c;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(52px, 10vw, 112px);
      font-weight: 560;
      letter-spacing: -.075em;
      line-height: .95;
    }
    h1 span { color: #b9d39c; }
    .topic {
      display: inline-block;
      margin: 22px 0 0;
      padding: 7px 13px;
      border: 1px solid #ff6b6b66;
      border-radius: 999px;
      color: #ff8585;
      font-size: 12px;
      letter-spacing: .08em;
    }
    .note { margin: 26px 0 0; color: #a7aca3; font-size: 15px; letter-spacing: .015em; }
    @media (max-width: 520px) {
      main { min-height: 60vh; border-radius: 22px; }
      main::before { width: 180px; height: 180px; }
      main::after { width: 270px; height: 270px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <p class="eyebrow">A little hello</p>
      <h1>hello <span>codex</span></h1>
      <p class="topic">homework</p>
      <p class="note">A fresh page, ready for what’s next.</p>
    </div>
  </main>
</body>
</html>
